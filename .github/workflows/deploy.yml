# Workflow otomatis untuk build dan deploy aplikasi Vite React ke GitHub Pages
name: Deploy SIAKAD ke GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Izin yang diperlukan oleh GITHUB_TOKEN untuk deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi hanya satu deployment aktif sekaligus
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Proyek (Vite)
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact Hasil Build (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          # Folder hasil kompilasi Vite yang siap disajikan ke publik
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
