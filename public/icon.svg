<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with squircle for Android / PWA -->
  <rect width="512" height="512" rx="112" fill="url(#gradTeal)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 8" />
  
  <!-- Icon Group Centered in 80% Safe Area -->
  <g filter="url(#shadow)" transform="translate(0, -6)">
    <!-- Graduation Cap Roof -->
    <path d="M256 128 L396 196 L256 264 L116 196 Z" fill="#ffffff" />
    <path d="M256 128 L396 196 L256 216 L116 196 Z" fill="#f0fdfa" opacity="0.6" />
    
    <!-- Tassel -->
    <path d="M168 220 L168 280 C168 290 156 295 156 308 C156 316 162 322 170 322 C178 322 184 316 184 308 C184 295 172 290 172 280 L172 220 Z" fill="url(#goldAccent)" />
    <circle cx="170" cy="222" r="5" fill="#f59e0b" />

    <!-- Open Book Below -->
    <path d="M256 292 C220 274 168 274 140 286 L140 376 C168 364 220 364 256 382 C292 364 344 364 372 376 L372 286 C344 274 292 274 256 292 Z" fill="#ffffff" opacity="0.95" />
    <!-- Book Spine Divider -->
    <line x1="256" y1="292" x2="256" y2="382" stroke="#0d9488" stroke-width="4" stroke-linecap="round" />
    
    <!-- Book Content Lines (Left Page) -->
    <line x1="164" y1="316" x2="236" y2="316" stroke="#99f6e4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="164" y1="334" x2="232" y2="334" stroke="#99f6e4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="164" y1="352" x2="216" y2="352" stroke="#99f6e4" stroke-width="3.5" stroke-linecap="round" />

    <!-- Book Content Lines (Right Page) -->
    <line x1="276" y1="316" x2="348" y2="316" stroke="#99f6e4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="280" y1="334" x2="348" y2="334" stroke="#99f6e4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="296" y1="352" x2="348" y2="352" stroke="#99f6e4" stroke-width="3.5" stroke-linecap="round" />

    <!-- Academic Star Badge -->
    <polygon points="256,238 262,252 277,253 265,263 269,278 256,270 243,278 247,263 235,253 250,252" fill="url(#goldAccent)" />
  </g>
</svg>
